[package]
name = "rekordbox-export-builder"
version.workspace = true
edition = "2021"

[[bin]]
name = "export-builder"
path = "src/main.rs"

[dependencies]
rekordbox-export = { path = "../../crates/rekordbox-export" } # pulls core+device-library (OpenSSL) — confined to this image
rekordbox-meta = { path = "../../crates/rekordbox-meta" }
rekordbox-store = { path = "../../crates/rekordbox-store" }

axum = "0.8"
tokio = { workspace = true, features = ["time"] } # + timers for the sweeper
tokio-util = { version = "0.7", features = ["io"] } # ReaderStream for file streaming
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }