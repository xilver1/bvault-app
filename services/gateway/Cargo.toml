[package]
name = "bvault-gateway"
version.workspace = true
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
bvault-jobs = { path = "../../crates/bvault-jobs" }
bvault-meta = { path = "../../crates/bvault-meta" }
bvault-store = { path = "../../crates/bvault-store" }
bvault-auth = { path = "../../crates/bvault-auth" }
bvault-hash = { path = "../../crates/bvault-hash" }

axum = { version = "0.8", features = ["multipart"] }
# Current-thread runtime (see main.rs). Workspace tokio already has rt/net/macros.
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
# The gateway owns migrations, hence `migrate`. Row-type features (chrono/uuid/
# json/macros) come transitively from jobs/meta via Cargo feature unification.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "postgres", "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
# Session expiry math (Utc::now() + ttl) and serializing expires_at in responses.
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
bytes = "1.5"