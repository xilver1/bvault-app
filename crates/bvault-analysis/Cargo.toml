[package]
name = "bvault-analysis"
version.workspace = true
edition = "2021"

[dependencies]
# Types only (TrackAnalysis, BeatGrid, Waveform, FileType, ...). The default
# feature set intentionally excludes `device-library`, so this crate — and the
# analysis worker built on it — never compiles SQLCipher/OpenSSL.
bvault-core = { path = "../bvault-core" }

symphonia = { workspace = true }
rustfft = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.13"