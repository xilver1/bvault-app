name: Build export-builder image

on:
  push:
    branches: [main]
    paths:
      - "services/export-builder/**"
      - "crates/bvault-export/**"
      - "crates/bvault-core/**"
      - "crates/bvault-meta/**"
      - "crates/bvault-store/**"
      - "crates/bvault-auth/**"
      - "crates/bvault-manifest/**"
      - "crates/bvault-telemetry/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      service: export-builder