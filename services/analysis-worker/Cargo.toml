[package]
name = "bvault-analysis-worker"
version.workspace = true
edition = "2021"

[[bin]]
name = "analysis-worker"
path = "src/main.rs"

[dependencies]
bvault-jobs = { path = "../../crates/bvault-jobs" }
bvault-store = { path = "../../crates/bvault-store" }
bvault-analysis = { path = "../../crates/bvault-analysis" }
# Note: no direct bvault-core dep — TrackAnalysis comes back from
# analyze_source and its Serialize impl is used transitively; nothing here names
# a core type. And no SQLCipher/OpenSSL, since -analysis pulls -core with the
# device-library feature OFF. This worker image stays tiny.

tokio = { workspace = true, features = ["time"] } # + timers; workspace has rt/macros
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }