[package]
name = "bvault-store"
version.workspace = true
edition = "2021"

[dependencies]
# Deliberately tiny: the store is pure filesystem and content-agnostic. It does
# not depend on bvault-core or -analysis — it moves opaque named blobs keyed
# by a hash, and neither knows nor cares what those blobs are.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.13"