name: Build service images and push to ECR
on:
  push:
    branches: [main]
    paths:
      - 'services/export-builder/**'
      - 'crates/bvault-export/**'
      - 'crates/bvault-meta/**'
      - 'crates/bvault-store/**'

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  deploy-compute:
    name: Deploy ansible playbooks to compute servers
    runs-on: ubuntu-latest
    steps:
      - name: Chekout repo
        uses: actions/checkout@v6
      
      - name: Satisfy AWS SDK dependencies on venv
        run: |
          pipx inject ansible-core boto3 botocore

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11"

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854469103070:role/lab-infra-ci
          aws-region: us-east-1

      - name: Load CI OAuth creds from SSM to access Tailnet
        run: |
          ID=$(aws ssm get-parameter --name /lab/tailscale/ci-oauth-client-id --query Parameter.Value --output text)
          SECRET=$(aws ssm get-parameter --name /lab/tailscale/ci-oauth-client-secret --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"
          echo "CI_OAUTH_ID=$ID" >> "$GITHUB_ENV"
          echo "CI_OAUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Retrieve and load pre-generated SSH private key 
        run: |
          mkdir -p ~/.ssh && chmod 0700 ~/.ssh
          aws ssm get-parameter --name /lab/ci/ssh-private-key --with-decryption --query Parameter.Value --output text > ~/.ssh/id_ed25519 && chmod 0600 ~/.ssh/id_ed25519
          aws ssm get-parameter --name /lab/ci/ssh-public-key --query Parameter.Value --output text > ~/.ssh/id_ed25519.pub && chmod 0600 ~/.ssh/id_ed25519.pub

      - name: Tailnet access and test connectivity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.CI_OAUTH_ID }}
          oauth-secret: ${{ env.CI_OAUTH_SECRET }}
          tags: tag:ci
          ping: 192.168.0.191

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -target=module.app-resources -out tfplan -no-color

      - name: Terraform Apply
        id: apply
        run: terraform apply tfplan -no-color

      - name: Build and push image to ECR repository
        id: tf_outputs
        run: |
        
         # Extract necessary info
          ECR_REPO=$(terraform output -raw bvault_ecr_repo)
          IMAGE_TAG="$ECR_REPO/gateway:${{ github.sha }}"
          
          # Build and push
         docker build -f services/export-builder/Dockerfile -t $IMAGE_TAG .
         docker push $IMAGE_TAG 