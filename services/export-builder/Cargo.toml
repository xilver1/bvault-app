[package]
name = "bvault-export-builder"
version.workspace = true
edition = "2021"

[[bin]]
name = "export-builder"
path = "src/main.rs"

[dependencies]
bvault-export = { path = "../../crates/bvault-export" } # pulls core+device-library (OpenSSL) — confined to this image
bvault-meta = { path = "../../crates/bvault-meta" }
bvault-store = { path = "../../crates/bvault-store" }
# Validates session tokens itself: the ingress routes /exports straight here,
# so this service authenticates rather than trusting an upstream. Pure crate
# (argon2/sha2) — no OpenSSL beyond what bvault-export already pulls.
bvault-auth = { path = "../../crates/bvault-auth" }

axum = "0.8"
tokio = { workspace = true, features = ["time"] } # + timers for the sweeper
tokio-util = { version = "0.7", features = ["io"] } # ReaderStream for file streaming
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }