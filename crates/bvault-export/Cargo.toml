[package]
name = "bvault-export"
version.workspace = true
edition = "2021"

[dependencies]
# The ONE place among the running services' deps that re-enables core's
# `device-library` feature (SQLCipher). Confining it here keeps OpenSSL out of
# the gateway and worker images. Building this crate needs Perl + NASM on Windows
# (to compile vendored OpenSSL), same as when device_library.rs first landed.
bvault-core = { path = "../bvault-core", features = ["device-library"] }
bvault-store = { path = "../bvault-store" }
# The manifest wire types now live in a serde-only leaf crate; re-exported from
# this crate so server-side call sites still say `bvault_export::Manifest`.
bvault-manifest = { path = "../bvault-manifest" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }