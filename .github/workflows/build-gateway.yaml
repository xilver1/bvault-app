name: Build gateway image

on:
  push:
    branches: [main]
    paths:
      - "services/gateway/**"
      - "crates/bvault-jobs/**"
      - "crates/bvault-meta/**"
      - "crates/bvault-store/**"
      - "crates/bvault-auth/**"
      - "crates/bvault-hash/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      service: gateway
