name: Build analysis-worker image

on:
  push:
    branches: [main]
    paths:
      - "services/analysis-worker/**"
      - "crates/bvault-analysis/**"
      - "crates/bvault-core/**"
      - "crates/bvault-jobs/**"
      - "crates/bvault-store/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      service: analysis-worker