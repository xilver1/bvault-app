[workspace]
resolver = "2"

members = [
    "crates/bvault-core",
    "crates/bvault-hash",
    "crates/bvault-auth",
    "crates/bvault-analysis",
    "crates/bvault-jobs",
    "crates/bvault-store",
    "crates/bvault-meta",
    "crates/bvault-export",
    "crates/bvault-manifest",
    "crates/bvault-transfer",
    "crates/bvault-cli",
    "services/analysis-worker",
    "services/export-builder",
    "services/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["bvault contributors"]
license = "MIT"
repository = "https://github.com/xilver1/bvault"

[workspace.dependencies]
# Binary serialization
binrw = "0.14"

# Audio decoding - pure Rust, streaming support
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "flac", "aac", "wav", "aiff", "pcm", "isomp4"
]}

# FFT for waveform generation - SIMD optimized
rustfft = "6.2"

# Async runtime - single-threaded for memory efficiency
tokio = { version = "1.41", features = ["rt", "net", "io-util", "sync", "macros", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Path handling
walkdir = "2.5"

# Hashing for cache keys
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# CLI and HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
oauth2 = "4.4"
tiny_http = "0.12"
webbrowser = "0.8"
dialoguer = "0.11"
indicatif = "0.17"
sysinfo = "0.30"
dirs = "5.0"
comfy-table = "7.1"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true